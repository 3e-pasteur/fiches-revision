services:
  - type: web
    name: fiches-revision
    runtime: static
    buildCommand: echo "Site statique, rien à construire"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
