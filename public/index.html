<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes fiches de révision</title>
<meta name="description" content="Fiches de révision pour le brevet : cours courts, méthodes et quiz corrigés.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#f6f9ff;--sheet:#ffffff;--ink:#1c2540;--muted:#5d6785;--line:#d9e2f5;--hline:#e3ebfa;--vline:#e3ebfa;--margin:#e8737b;--shadow:rgba(28,37,64,.10);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#121827;--sheet:#1b2336;--ink:#e9edf9;--muted:#9aa5c4;--line:#2c3856;--hline:#18213a;--vline:#18213a;--margin:#a84a54;--shadow:rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--paper:#121827;--sheet:#1b2336;--ink:#e9edf9;--muted:#9aa5c4;--line:#2c3856;--hline:#18213a;--vline:#18213a;--margin:#a84a54;--shadow:rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--vline) 1px,transparent 1px),linear-gradient(90deg,var(--vline) 1px,transparent 1px),linear-gradient(var(--hline) 1px,transparent 1px);
  background-size:100% 32px,32px 100%,100% 8px;
  position:relative}
body::before{content:"";position:fixed;top:0;bottom:0;left:64px;width:2px;background:var(--margin);opacity:.65;pointer-events:none}
main{max-width:1000px;margin:0 auto;padding:30px 20px 64px 92px}
header{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:26px}
h1{font:700 clamp(2.3rem,6vw,3.4rem)/1 Caveat,"Segoe Script","Bradley Hand",cursive;margin:0;letter-spacing:.01em}
.lead{margin:6px 0 0;color:var(--muted);max-width:44ch}
.progress{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:10px 18px 10px 12px;box-shadow:0 3px 0 var(--line)}
.ring{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:#2b8a5e;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ptxt b{display:block;font-size:1.25rem;line-height:1.1}
.ptxt span{color:var(--muted);font-size:.88rem}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;position:relative;z-index:1}
.tab{--c:#4b5a73;appearance:none;display:flex;align-items:center;gap:8px;min-width:0;padding:9px 8px 9px 9px;
  border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left;
  font:600 .95rem Figtree,system-ui,sans-serif;box-shadow:0 2px 0 var(--line);
  transition:transform .15s ease,background-color .15s ease,border-color .15s ease,box-shadow .15s ease}
.tab .ico{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;
  background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tab .tx{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;line-height:1.2}
.tab .nm{font-weight:700;font-size:.85rem;white-space:nowrap;letter-spacing:-.005em}
.tab .n{font-weight:500;font-size:.78rem;color:var(--muted);margin-top:2px}
.tab:hover{transform:translateY(-2px);border-color:var(--c)}
.tab[aria-pressed=true]{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tab[aria-pressed=true] .ico{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4)}
.tab[aria-pressed=true] .n{color:rgba(255,255,255,.88)}
.tab:focus-visible,.btn:focus-visible,.open:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3b5bdb;outline-offset:2px}
.board{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 24px var(--shadow)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 220px;position:relative}
.search input{width:100%;padding:11px 40px 11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit}
.hit{margin:8px 0 0;font-size:.84rem;line-height:1.45;color:var(--muted)}
.hit b{font-weight:700;color:var(--ink);margin-right:4px}
.hit mark{background:rgba(255,205,60,.5);color:inherit;border-radius:3px;padding:0 2px}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 .75rem Figtree,sans-serif;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--sheet)}
select,.btn{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg .btn{border:none;border-radius:0}
.seg .btn[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.list.rows{grid-template-columns:1fr}
.fiche{--c:#4b5a73;position:relative;background:var(--sheet);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:6px 14px 14px 6px;padding:16px 16px 14px 18px;display:flex;flex-direction:column;gap:8px;transition:transform .18s,box-shadow .18s}
.fiche:hover{transform:translateY(-2px);box-shadow:0 8px 18px var(--shadow)}
.rows .fiche{flex-direction:row;align-items:center;gap:18px}
.rows .body{flex:1}
.top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
.top .em{font-size:1.2rem}
.top b{color:var(--c);font-weight:700}
.fiche h2{margin:0;font-size:1.12rem;line-height:1.3}
.fiche p{margin:0;color:var(--muted);font-size:.93rem}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.rows .foot{margin:0;padding:0;flex-direction:column;align-items:flex-end}
.open{background:var(--c);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;padding:8px 16px;border-radius:10px;display:inline-block}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:#2b8a5e}
.stamp{position:absolute;top:12px;right:12px;font:700 1.15rem Caveat,cursive;color:#2b8a5e;border:2px solid #2b8a5e;border-radius:8px;padding:0 9px;transform:rotate(-7deg);opacity:0;pointer-events:none}
.fiche.done .stamp{opacity:.9;animation:stamp .35s cubic-bezier(.3,1.6,.5,1)}
.fiche.done{border-color:#2b8a5e;border-left-color:#2b8a5e}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.9}}
.qbadge{margin-top:2px;font-size:.82rem;font-weight:600;color:#2b8a5e}.qbadge.low{color:#e8590c}
.empty{text-align:center;padding:44px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 1.7rem Caveat,cursive;margin-bottom:4px}
.theme{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font-size:1.15rem;cursor:pointer;box-shadow:0 4px 12px var(--shadow)}
@media (max-width:640px){
  body::before{left:14px}
  main{padding:22px 14px 80px 28px}
  .rows .fiche{flex-direction:column;align-items:stretch}
  .rows .foot{flex-direction:row;align-items:center}
  .board{padding:12px;border-radius:14px}
  .tabs{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 8px;margin-right:-14px;scrollbar-width:thin}
  .tab{flex:none;scroll-snap-align:start;padding:7px 14px 7px 8px}
  .tab .nm{white-space:nowrap}
  .tab .ico{width:30px;height:30px;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){.tab:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Mes fiches de révision</h1>
      <p class="lead">Toutes les fiches au même endroit. Ouvrez-en une, puis cochez-la quand elle est révisée.</p>
    </div>
    <div class="progress" aria-live="polite">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="fg" cx="32" cy="32" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"/></svg>
      <div class="ptxt"><b id="pnum">0 / 0</b><span id="pmsg"></span></div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Matières"></nav>
  <section class="board">
    <div class="tools">
      <div class="search"><input type="search" id="q" placeholder="Rechercher un mot, une notion, une date…" aria-label="Rechercher dans toutes les fiches"><kbd>/</kbd></div>
      <select id="sort" aria-label="Trier">
        <option value="recent">Plus récentes</option>
        <option value="subject">Par matière</option>
        <option value="az">A à Z</option>
        <option value="todo">À réviser d’abord</option>
      </select>
      <div class="seg" role="group" aria-label="Affichage">
        <button class="btn" id="vgrid" aria-pressed="true" type="button">Cartes</button>
        <button class="btn" id="vrows" aria-pressed="false" type="button">Liste</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden></div>
  </section>
</main>
<button class="theme" id="theme" type="button" aria-label="Changer de thème">🌓</button>

<script src="data.js"></script>
<script>

const SUBJ = {
  "Français":{c:"#cf3a45",e:"📖"},
  "Maths":{c:"#3b5bdb",e:"📐"},
  "Histoire":{c:"#b7791f",e:"🏛️"},
  "Géographie":{c:"#1098ad",e:"🌍"},
  "EMC":{c:"#9c36b5",e:"⚖️"},
  "SVT":{c:"#2b8a5e",e:"🌱"},
  "Physique-chimie":{c:"#e8590c",e:"⚗️"},
  "Technologie":{c:"#5f3dc4",e:"⚙️"},
  "Général":{c:"#4b5a73",e:"🎓"}
};
const meta = s => SUBJ[s] || {c:"#4b5a73",e:"📄"};
const ORDER = Object.keys(SUBJ);
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let done = store.get("fiches-done", {});
let view = store.get("fiches-view", "grid");
let sort = store.get("fiches-sort", "recent");
let subject = "Toutes";

const fmt = d => { const p = d.split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : d; };
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");

function renderTabs(){
  const nav = $("tabs"); nav.textContent = "";
  const present = Array.from(new Set(FICHES.map(f => f.subject)));
  present.sort((a,b) => (ORDER.indexOf(a) + 100) % 100 - (ORDER.indexOf(b) + 100) % 100);
  ["Toutes"].concat(present).forEach(s => {
    const n = s === "Toutes" ? FICHES.length : FICHES.filter(f => f.subject === s).length;
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab";
    b.style.setProperty("--c", s === "Toutes" ? "#3b4a78" : meta(s).c);
    b.setAttribute("aria-pressed", String(s === subject));
    const ico = document.createElement("span"); ico.className = "ico"; ico.setAttribute("aria-hidden", "true");
    ico.textContent = s === "Toutes" ? "📚" : meta(s).e;
    const t = document.createElement("span"); t.className = "nm"; t.textContent = s;
    const c = document.createElement("span"); c.className = "n"; c.textContent = n;
    c.textContent = plural(n, "fiche");
    const tx = document.createElement("span"); tx.className = "tx"; tx.append(t, c);
    b.append(ico, tx);
    b.onclick = () => { subject = s; renderTabs(); render(); };
    nav.appendChild(b);
  });
}

function renderProgress(){
  const total = FICHES.length, n = FICHES.filter(f => done[f.id]).length;
  $("pnum").textContent = n + " / " + total;
  $("fg").style.strokeDashoffset = String(163.36 * (1 - (total ? n / total : 0)));
  $("pmsg").textContent = total === 0 ? "Aucune fiche" : n === total ? "Tout est révisé, bravo !" : "Encore " + plural(total - n, "fiche") + " à réviser";
}

function sorted(list){
  const a = list.slice();
  if (sort === "recent") a.sort((x,y) => y.date.localeCompare(x.date));
  else if (sort === "az") a.sort((x,y) => x.title.localeCompare(y.title, "fr"));
  else if (sort === "subject") a.sort((x,y) => ORDER.indexOf(x.subject) - ORDER.indexOf(y.subject) || y.date.localeCompare(x.date));
  else a.sort((x,y) => (done[x.id] ? 1 : 0) - (done[y.id] ? 1 : 0) || y.date.localeCompare(x.date));
  return a;
}


/* Recherche plein texte : l'index (search.js, généré par tools/build-search.py) est chargé au premier usage. */
let idx = null, idxLoading = false;
const strip = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/œ/g, "oe").replace(/æ/g, "ae").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
const ACC = { a: "aàâä", c: "cç", e: "eéèêë", i: "iîï", o: "oôöœ", u: "uùûü", y: "yÿ" };
const termRe = ts => new RegExp(ts.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").split("").map(ch => ACC[ch] ? "[" + ACC[ch] + "]" : ch).join("")).join("|"), "giu");
function loadIndex(){
  if (idx || idxLoading) return;
  idxLoading = true;
  const sc = document.createElement("script");
  sc.src = "search.js";
  sc.onload = () => {
    idx = {};
    for (const u in SEARCH) {
      const segs = SEARCH[u].c.map(t => ({ t: t, k: "Cours" })).concat(SEARCH[u].q.map(t => ({ t: t, k: "Quiz" })));
      const n = segs.map(g => strip(g.t));
      idx[u] = { segs: segs, n: n, all: " " + n.join(" ") + " " };
    }
    idxLoading = false; render();
  };
  sc.onerror = () => { idxLoading = false; };
  document.head.appendChild(sc);
}
function count(hay, t){ let c = 0, i = hay.indexOf(t); while (i !== -1 && c < 5) { c++; i = hay.indexOf(t, i + t.length); } return c; }
/* Retourne {score, snippet} si la fiche répond à la recherche, sinon null. */
function matchFiche(f, terms){
  const title = strip(f.title), head = " " + strip(f.title + " " + f.desc + " " + f.subject) + " ";
  const body = idx && idx[f.url] ? idx[f.url] : null;
  let score = 0, inBody = false;
  for (const t of terms) {
    const h = head.includes(t), b = body ? body.all.includes(t) : false;
    if (!h && !b) return null;
    if (title.includes(t)) score += 6; else if (h) score += 3;
    if (b) { inBody = true; score += count(body.all, t); }
  }
  let snippet = null;
  if (body && inBody && !terms.every(t => title.includes(t))) {
    let best = -1, bi = -1;
    body.n.forEach((n, i) => {
      const c = terms.filter(t => n.includes(t)).length;
      const sc = c * 10 + (body.segs[i].k === "Cours" ? 1 : 0);
      if (c && sc > best) { best = sc; bi = i; }
    });
    if (bi >= 0) snippet = { seg: body.segs[bi], re: termRe(terms) };
  }
  return { score: score, snippet: snippet };
}
function snippetNode(sn){
  const text = sn.seg.t, first = sn.re.exec(text); sn.re.lastIndex = 0;
  const at = first ? first.index : 0, from = Math.max(0, at - 70), to = Math.min(text.length, from + 210);
  const part = text.slice(from, to);
  const p = document.createElement("p"); p.className = "hit";
  const lab = document.createElement("b"); lab.textContent = sn.seg.k + " :"; p.appendChild(lab);
  p.appendChild(document.createTextNode(" " + (from > 0 ? "… " : "")));
  let last = 0, m;
  while ((m = sn.re.exec(part)) !== null) {
    if (m[0] === "") { sn.re.lastIndex++; continue; }
    p.appendChild(document.createTextNode(part.slice(last, m.index)));
    const mk = document.createElement("mark"); mk.textContent = m[0]; p.appendChild(mk);
    last = m.index + m[0].length;
  }
  sn.re.lastIndex = 0;
  p.appendChild(document.createTextNode(part.slice(last) + (to < text.length ? " …" : "")));
  return p;
}

function render(){
  const term = $("q").value.trim();
  const terms = strip(term).split(" ").filter(Boolean);
  const hits = new Map();
  let list = FICHES.filter(f => {
    if (subject !== "Toutes" && f.subject !== subject) return false;
    if (!terms.length) return true;
    const r = matchFiche(f, terms);
    if (r) hits.set(f.id, r);
    return !!r;
  });
  list = terms.length ? list.sort((x, y) => hits.get(y.id).score - hits.get(x.id).score) : sorted(list);
  const box = $("list");
  box.textContent = "";
  box.className = "list" + (view === "rows" ? " rows" : "");
  list.forEach(f => {
    const m = meta(f.subject);
    const card = document.createElement("article");
    card.className = "fiche" + (done[f.id] ? " done" : "");
    card.style.setProperty("--c", m.c);
    const stamp = document.createElement("div"); stamp.className = "stamp"; stamp.textContent = "Révisée";
    const body = document.createElement("div"); body.className = "body";
    const top = document.createElement("div"); top.className = "top";
    const em = document.createElement("span"); em.className = "em"; em.textContent = m.e;
    const sb = document.createElement("b"); sb.textContent = f.subject;
    const lv = document.createElement("span"); lv.textContent = f.level + ", " + fmt(f.date);
    top.append(em, sb, lv);
    const h = document.createElement("h2"); h.textContent = f.title;
    const p = document.createElement("p"); p.textContent = f.desc;
    body.append(top, h, p);
    const hit = hits.get(f.id);
    if (hit && hit.snippet) body.appendChild(snippetNode(hit.snippet));
    let qr = null;
    try { qr = JSON.parse(localStorage.getItem("quiz:" + f.url.split("/").pop()) || "null"); } catch(e){}
    if (qr) { const qb = document.createElement("div"); qb.className = "qbadge" + (qr.best < 70 ? " low" : ""); qb.textContent = "Quiz : meilleur score " + qr.best + " %"; body.appendChild(qb); }
    const foot = document.createElement("div"); foot.className = "foot";
    const a = document.createElement("a"); a.className = "open"; a.href = f.url; a.textContent = "Ouvrir la fiche";
    const lab = document.createElement("label"); lab.className = "check";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!done[f.id];
    cb.onchange = () => { done[f.id] = cb.checked; store.set("fiches-done", done); render(); };
    lab.append(cb, document.createTextNode("Révisée"));
    foot.append(a, lab);
    card.append(stamp, body, foot);
    box.appendChild(card);
  });
  const empty = $("empty");
  empty.hidden = list.length > 0;
  if (!list.length){
    empty.textContent = "";
    const b = document.createElement("b");
    b.textContent = term ? "Aucun résultat" : "Rien dans ce classeur pour l’instant";
    empty.append(b, document.createTextNode(term ? "Essayez un autre mot (la recherche ignore les accents), ou choisissez « Toutes »." : "Demandez à Claude de créer une fiche pour cette matière."));
  }
  renderProgress();
}

function setView(v){
  view = v; store.set("fiches-view", v);
  $("vgrid").setAttribute("aria-pressed", String(v === "grid"));
  $("vrows").setAttribute("aria-pressed", String(v === "rows"));
  render();
}
$("vgrid").onclick = () => setView("grid");
$("vrows").onclick = () => setView("rows");
$("sort").value = sort;
$("sort").onchange = e => { sort = e.target.value; store.set("fiches-sort", sort); render(); };
$("q").addEventListener("input", () => { loadIndex(); render(); });
$("q").addEventListener("focus", loadIndex);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape" && document.activeElement === $("q")) { $("q").value = ""; $("q").blur(); render(); }
});
$("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("fiches-theme", root.dataset.theme);
};
const savedTheme = store.get("fiches-theme", null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

renderTabs();
setView(view);
